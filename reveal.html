<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reveal &middot; School Vote</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/app.css">
<style>
  html, body { height: 100%; margin: 0; overflow: hidden; background: #05070f; }
  body { font-variant-numeric: tabular-nums; }
  .rv-bar-track { height: 1.6rem; border-radius: 999px; background: rgba(148,163,184,.16); overflow: hidden; }
  .rv-fill { height: 100%; width: 0; border-radius: 999px; transition: width .18s linear; }
  .rv-name { font-size: clamp(2rem, 7vw, 6rem); line-height: 1.02; }
  @media (min-width: 1024px) { .rv-bar-track { height: 2.2rem; } }
</style>
</head>
<body class="text-slate-100">
<main id="stage" class="h-full w-full flex flex-col items-center justify-center gap-8 px-6 py-10 text-center"></main>
<button id="mute" type="button"
        class="fixed bottom-4 right-4 btn btn-ghost text-xs">Sound: on</button>
<script type="module" src="js/reveal.js"></script>
</body>
</html>
