<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Vote &ndash; Role Model</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/app.css">
</head>
<body class="h-full bg-slate-950 text-slate-100 flex flex-col overflow-hidden">

<header class="bg-slate-900/80 border-b border-slate-800 px-4 md:px-6 py-3 flex items-center justify-between gap-3 shrink-0">
    <div class="flex items-center gap-3 min-w-0">
        <div class="w-9 h-9 rounded-lg bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-white shrink-0" id="hd-icon"></div>
        <div class="min-w-0">
            <h1 class="font-bold text-sm md:text-base leading-tight truncate" id="hd-title">Role Model Vote</h1>
            <p class="text-xs text-slate-400 truncate" id="hd-class">&nbsp;</p>
        </div>
    </div>
    <div class="flex items-center gap-2 shrink-0">
        <span class="pill bg-slate-800 text-slate-300" id="held-pill" hidden></span>
        <span class="pill bg-slate-800 text-slate-300" id="net-pill"></span>
    </div>
</header>

<main id="view" class="flex-1 flex flex-col min-h-0"></main>

<div id="toast" class="pointer-events-none fixed inset-x-0 bottom-6 z-50 flex justify-center opacity-0 transition-opacity duration-200">
    <div class="px-5 py-3 rounded-xl bg-slate-800 border border-slate-700 text-sm font-semibold shadow-2xl" id="toast-msg"></div>
</div>

<script type="module" src="js/kiosk.js"></script>
</body>
</html>
